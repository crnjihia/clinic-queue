name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  flutter-ci:
    name: Flutter Mobile CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd apps/mobile
          flutter pub get

      - name: Run Static Analysis & Lints
        run: |
          cd apps/mobile
          flutter analyze --fatal-infos

      - name: Run Unit & BLoC Tests
        run: |
          cd apps/mobile
          flutter test --coverage

  functions-ci:
    name: Cloud Functions CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install Cloud Functions Dependencies
        run: |
          cd functions
          npm ci

      - name: Run ESLint
        run: |
          cd functions
          npm run lint

      - name: Build TypeScript Code
        run: |
          cd functions
          npm run build

      - name: Run Cloud Functions Tests
        run: |
          cd functions
          npm test
