# path: apps/mobile/pubspec.yaml
name: clinic_queue
description: Outpatient clinic appointments and live queue management for Kenya.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: '>=0.18.1 <1.0.0'

  # State Management & Routing
  async: ^2.11.0
  flutter_bloc: ^8.1.5
  go_router: ^13.2.0
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^7.6.7
  injectable: ^2.4.2

  # Firebase Ecosystem
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  firebase_messaging: ^14.7.19

  # Local Notifications & Device Utilities
  flutter_local_notifications: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  injectable_generator: ^2.6.1
  bloc_test: ^9.1.7
  mockito: ^5.4.4
  alchemist: ^0.7.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
